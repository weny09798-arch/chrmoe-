services:
  app:
    build: .
    restart: unless-stopped
    environment:
      LICENSE_CONFIG: /run/license/config.json
    volumes:
      - ${LICENSE_PRIVATE_DIR:?Set external LICENSE_PRIVATE_DIR}/config.json:/run/license/config.json:ro
      - ${LICENSE_PRIVATE_DIR:?Set external LICENSE_PRIVATE_DIR}/signing.pem:/run/license/signing.pem:ro
      - ${LICENSE_PRIVATE_DIR:?Set external LICENSE_PRIVATE_DIR}/data:/var/lib/license
    expose:
      - "8000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LICENSE_HOST: ${LICENSE_HOST:?Set production LICENSE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - edge
networks:
  backend:
    internal: true
  edge:
volumes:
  caddy_data:
  caddy_config:

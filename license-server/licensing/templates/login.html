<!doctype html>
<html lang="en"><meta charset="utf-8"><title>License administration login</title>
<h1>License administration</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Administrator password <input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label>
<button type="submit">Sign in</button></form></html>
